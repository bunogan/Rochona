<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>রচনাসংকলন : মাহবুবুর রহমান</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5f6e">
<meta name="description" content="মাহবুবুর রহমানের গ্রন্থ, প্রবন্ধ ও গল্প — অনলাইনে পড়ুন।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Noto+Serif+Bengali:wght@400;600&family=Hind+Siliguri:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
<style>
.loading{max-width:var(--measure);margin:4rem auto;font-family:var(--f-ui);color:var(--ink-soft)}
.pdfpages{display:grid;gap:14px;margin-top:1rem}
.pdfpages canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 0 0 1px var(--rule)}
.pdfpages .ph{aspect-ratio:1/1.414;max-width:100%;background:var(--paper-2);display:grid;place-items:center;font-family:var(--f-ui);color:var(--ink-soft);font-size:.85rem}
.authorlink{font-family:var(--f-ui);font-size:.9rem;align-self:center;padding:4px 10px;border:1px solid var(--rule);border-radius:6px;text-decoration:none;color:var(--accent);margin-right:4px;white-space:nowrap}
.authorlink:hover{border-color:var(--accent)}
.pdflink{font-family:var(--f-ui);font-size:.95rem}
.reading img{max-width:100%;height:auto}
.reading blockquote{margin:1.6em 0;padding-left:1.3em;border-left:3px solid var(--accent);font-family:var(--f-display)}
.reading table{border-collapse:collapse;max-width:100%}
.reading td,.reading th{border:1px solid var(--rule);padding:.3em .6em}
.latest{max-width:var(--measure);margin:0 auto 2.4rem;background:var(--accent-soft);border-radius:8px;padding:1.4rem 1.5rem 1.3rem}
.latest a{text-decoration:none;color:inherit;display:block;margin-top:.35rem}
.latest .wt{font-family:var(--f-display);font-size:1.9rem;line-height:1.3;margin:0}
.latest a:hover .wt{color:var(--accent)}
.latest .wd{margin:.35rem 0 .5rem;color:var(--ink-soft);line-height:1.7}
.latest .wm{font-family:var(--f-ui);font-size:.85rem;color:var(--ink-soft)}
.works.cats a{display:block;padding:0}
.works.cats li{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:4px 20px;padding:1.6rem 0}
.works.cats a.cat{color:var(--accent);padding-top:.45rem;text-decoration:none;align-self:start}
.works.cats a.cat:hover{text-decoration:underline}
.works.cats .cnt{color:var(--ink-soft);font-weight:400}
.works.cats a.wlink{display:block;padding:0;text-decoration:none;color:inherit}
.works.cats a.wlink:hover .wt{color:var(--accent)}
.works.cats .more{display:inline-block;margin-top:.55rem;font-family:var(--f-ui);font-size:.9rem}
@media (max-width:520px){.works.cats li{grid-template-columns:1fr}}
.crumb{font-family:var(--f-ui);font-size:.9rem;text-decoration:none}
.catlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.catlist li{border-bottom:1px solid var(--rule)}
.catlist a{display:block;padding:1.4rem 0;text-decoration:none;color:inherit}
.catlist .wt{font-family:var(--f-display);font-size:1.6rem;line-height:1.3;margin:0}
.catlist a:hover .wt{color:var(--accent)}
.catlist .wd{margin:.35rem 0 .5rem;color:var(--ink-soft);line-height:1.7}
.catlist .wm{font-family:var(--f-ui);font-size:.85rem;color:var(--ink-soft)}
</style>

</head>
<body>
<header class="top wrap">
  <div class="bar">
    <a class="brand" href="#home">রচনাসংকলন <span>: মাহবুবুর রহমান</span></a>
    <div class="tools">
      <a id="authorlink" class="authorlink" href="lekhok.html" hidden>লেখক</a>
      <button type="button" id="fs-down" aria-label="লেখা ছোট করুন">জুম −</button>
      <button type="button" id="fs-up" aria-label="লেখা বড় করুন">জুম +</button>
      <button type="button" id="theme" aria-label="আলো বা অন্ধকার রং"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="display:block"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="progress" id="progress"></div>
</header>
<main id="app" class="wrap"><p class="loading">লোড হচ্ছে…</p></main>

<script>
(function(){
const app = document.getElementById('app');
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AUTHOR = 'মাহবুবুর রহমান';
let WORKS = null; const cache = {};
async function getJSON(p){const r = await fetch(p, {cache:'no-cache'}); if(!r.ok) throw new Error(p+' '+r.status); return r.json();}
async function works(){ if(!WORKS) WORKS = (await getJSON('works.json')).works; return WORKS; }
async function work(id){ if(!cache[id]) cache[id] = await getJSON(id+'.json'); return cache[id]; }

const delta = '<svg class="delta" viewBox="0 0 600 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14 C60 2 120 26 180 14 S300 2 360 14 S480 26 540 14 S590 8 600 12" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M0 20 C70 10 130 30 200 20 S320 10 390 20 S510 30 600 18" fill="none" stroke="currentColor" stroke-width=".8" opacity=".6"/></svg>';

const BN = n => String(n).replace(/[0-9]/g, d=>'০১২৩৪৫৬৭৮৯'[d]);
const KINDS = [['গ্রন্থ','granth','সব গ্রন্থ'],['প্রবন্ধ','probondho','সব প্রবন্ধ'],['গল্প','golpo','সব গল্প'],['কবিতা','kobita','সব কবিতা'],['স্মৃতিকথা','smritikotha','সব স্মৃতিকথা'],['অন্যান্য','onyanyo','অন্যান্য সব লেখা']];
function cats(W){
  const order = KINDS.map(k=>k[0]); const seen = [];
  W.forEach(w=>{ if(!seen.includes(w.kind)) seen.push(w.kind); });
  seen.sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b)));
  return seen.map((k,i)=>{ const f=KINDS.find(x=>x[0]===k); return {kind:k, token:'cat-'+(f?f[1]:'k'+i), all:f?f[2]:'সব '+k, items:W.filter(w=>w.kind===k)}; });
}
function catOf(W,kind){ return cats(W).find(c=>c.kind===kind); }
async function home(){
  document.title = 'রচনাসংকলন : ' + AUTHOR;
  const W = await works(); const C = cats(W); const L = W[0];
  app.innerHTML = `<section class="mast"><h1>রচনাসংকলন</h1><p class="by">${AUTHOR}</p>${delta}</section>
  ${L?`<section class="latest"><span class="label">সর্বশেষ লেখা · ${esc(L.kind)}</span><a href="#${L.id}"><h2 class="wt">${esc(L.title)}</h2>${L.desc?`<p class="wd">${esc(L.desc)}</p>`:''}<span class="wm">${esc(L.meta||'')}</span></a></section>`:''}
  <ul class="works cats">${C.map(c=>{const w=c.items[0];return `<li><a class="label cat" href="#${c.token}">${esc(c.kind)} <span class="cnt">(${BN(c.items.length)})</span></a><div class="body"><a class="wlink" href="#${w.id}"><h2 class="wt">${esc(w.title)}</h2>${w.desc?`<p class="wd">${esc(w.desc)}</p>`:''}<span class="wm">${esc(w.meta||'')}</span></a>${c.items.length>1?`<a class="more" href="#${c.token}">${esc(c.all)} (${BN(c.items.length)}) →</a>`:''}</div></li>`}).join('')}</ul>
  <p class="foot">© ${AUTHOR}। সব লেখার স্বত্ব লেখকের।</p>`;
}
async function category(c){
  document.title = c.kind + ' · ' + AUTHOR;
  app.innerHTML = `<div class="col"><header class="head"><a class="crumb" href="#home">← প্রথম পাতা</a><h1>${esc(c.kind)}</h1><p class="meta">${BN(c.items.length)}টি লেখা · নতুন থেকে পুরনো</p></header>
  <ul class="catlist">${c.items.map(w=>`<li><a href="#${w.id}"><h2 class="wt">${esc(w.title)}</h2>${w.desc?`<p class="wd">${esc(w.desc)}</p>`:''}<span class="wm">${esc(w.meta||'')}</span></a></li>`).join('')}</ul></div>`;
}
function backLink(kind){ const c = WORKS && catOf(WORKS, kind); return c ? `<a href="#${c.token}"><small>← ${esc(c.all)}</small><span>${esc(c.kind)}</span></a>` : `<a href="#home"><small>← সব রচনা</small><span>প্রথম পাতা</span></a>`; }

/* ---- book ---- */
function chId(id,i){return id+'-'+(i+1)}
function tocHTML(id,B,cur){
  const ch = B.chapters; const used = new Set();
  let h = `<a class="tb" href="#${id}">${esc(B.title)}</a>`;
  (B.parts||[]).forEach(p=>{
    h += `<div class="pt">${esc(p.name)}${p.sub?' · '+esc(p.sub):''}</div><ol>`;
    p.chapters.forEach(i=>{used.add(i);h+=item(i)}); h += '</ol>';
  });
  const rest = ch.map((_,i)=>i).filter(i=>!used.has(i));
  if(rest.length) h += (B.parts&&B.parts.length?'<div class="pt">শেষাংশ</div>':'')+'<ol>'+rest.map(item).join('')+'</ol>';
  function item(i){const c=ch[i];const cid=chId(id,i);return `<li><a class="ch" href="#${cid}"${cid===cur?' aria-current="page"':''}><span class="n">${esc(c.num||'·')}</span><span>${esc(c.title)}</span></a></li>`}
  return h;
}
function cover(id,B){
  document.title = B.title + ' · ' + AUTHOR;
  const ch = B.chapters; const used = new Set();
  const part = (name,sub,idx)=>`<section class="cpart">${name?`<h2>${esc(name)}</h2>`:''}${sub?`<h3>${esc(sub)}</h3>`:''}<ol>${idx.map(i=>{used.add(i);const c=ch[i];return `<li><a href="#${chId(id,i)}"><span class="cn">${esc(c.num||'·')}</span><span class="ct">${esc(c.title)}</span><span class="cm">${esc(c.mins)} মিনিট</span></a></li>`}).join('')}</ol></section>`;
  let parts = (B.parts||[]).map(p=>part(p.name,p.sub,p.chapters)).join('');
  const rest = ch.map((_,i)=>i).filter(i=>!used.has(i));
  if(rest.length) parts += part(B.parts&&B.parts.length?'শেষাংশ':'', B.parts&&B.parts.length?'':'সূচিপত্র', rest);
  app.innerHTML = `<div class="col cover">${(()=>{const c=catOf(WORKS,B.kind||'গ্রন্থ');return c?`<a class="crumb" href="#${c.token}">← ${esc(c.all)}</a><br>`:''})()}<span class="label">${esc(B.kind||'গ্রন্থ')}</span><h1>${esc(B.title)}</h1><p class="by">${AUTHOR}</p>
  ${B.img?`<figure class="lead-img"><img src="${esc(B.img)}" alt=""></figure>`:''}
  <a class="btn" href="#${chId(id,0)}">পড়া শুরু করুন</a><div class="cparts">${parts}</div></div>`;
}
function chapter(id,B,i){
  const ch = B.chapters; const c = ch[i]; const cur = chId(id,i);
  document.title = c.title + ' · ' + B.title;
  const prev = i>0, next = i<ch.length-1;
  const eyebrow = c.num ? `অধ্যায় ${esc(c.num)}` : (B.parts&&B.parts.length?'শেষাংশ':'');
  const partLine = c.part ? `<span class="label">${esc(c.part.name)}${c.part.sub?' · '+esc(c.part.sub):''}</span><br>` : '';
  app.innerHTML = `<div class="bookgrid"><nav class="toc" aria-label="সূচিপত্র">${tocHTML(id,B,cur)}</nav>
  <article class="col" style="max-width:var(--measure);margin:0">
    <details class="toc-mobile"><summary>সূচিপত্র · ${esc(B.title)}</summary><nav class="toc">${tocHTML(id,B,cur)}</nav></details>
    <header class="head">${partLine}${eyebrow?`<span class="label" style="color:var(--ink-soft)">${eyebrow}</span>`:''}<h1>${esc(c.title)}</h1>${c.sub?`<p class="sub">${esc(c.sub)}</p>`:''}<p class="meta">পড়তে প্রায় ${esc(c.mins)} মিনিট</p></header>
    <div class="reading">${c.html}</div>
    <nav class="pager" aria-label="অধ্যায়">${prev?`<a href="#${chId(id,i-1)}"><small>← আগের অধ্যায়</small><span>${esc(ch[i-1].title)}</span></a>`:`<a href="#${id}"><small>← সূচিপত্র</small><span>${esc(B.title)}</span></a>`}${next?`<a class="next" href="#${chId(id,i+1)}"><small>পরের অধ্যায় →</small><span>${esc(ch[i+1].title)}</span></a>`:`<a class="next" href="#${(catOf(WORKS,B.kind||'গ্রন্থ')||{token:'home'}).token}"><small>শেষ →</small><span>${esc((catOf(WORKS,B.kind||'গ্রন্থ')||{all:'প্রথম পাতা'}).all)}</span></a>`}</nav>
  </article></div>`;
}

/* ---- single piece ---- */
function piece(id,e){
  document.title = e.title + ' · ' + AUTHOR;
  app.innerHTML = `<article class="col"><header class="head"><span class="label">${esc(e.kind)}</span><h1>${esc(e.title)}</h1><p class="meta">${[e.date?esc(e.date):'', e.mins?`পড়তে ${esc(e.mins)} মিনিট`:''].filter(Boolean).join(' · ')}</p></header>
  ${e.img?`<figure class="lead-img"><img src="${esc(e.img)}" alt="${esc(e.alt||'')}"></figure>`:''}
  <div class="reading">${e.html}</div>
  ${e.date?`<p class="dateline">প্রথম প্রকাশ: ${esc(e.date)}${e.edited?` · সর্বশেষ সম্পাদনা: ${esc(e.edited)}`:''}</p>`:''}
  <nav class="pager">${backLink(e.kind)}</nav></article>`;
}

/* ---- PDF ---- */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function pdfLib(){
  if(!window.pdfjsLib){ await loadScript(PDFJS+'pdf.min.js'); await loadScript(PDFJS+'pdf.worker.min.js'); }
  return window.pdfjsLib;
}
async function pdfView(id,e){
  document.title = e.title + ' · ' + AUTHOR;
  app.innerHTML = `<article class="col"><header class="head"><span class="label">${esc(e.kind)}</span><h1>${esc(e.title)}</h1><p class="meta">${e.date?esc(e.date)+' · ':''}<a class="pdflink" href="${esc(e.pdf)}" target="_blank" rel="noopener">PDF ফাইলটি আলাদা খুলুন</a></p></header>
  <div class="pdfpages" id="pdfpages"><p class="loading" style="margin:1rem 0">পাতাগুলো লোড হচ্ছে…</p></div>
  <nav class="pager">${backLink(e.kind)}</nav></article>`;
  const box = document.getElementById('pdfpages');
  try{
    const lib = await pdfLib();
    const doc = await lib.getDocument(e.pdf).promise;
    box.innerHTML = '';
    const slots = [];
    for(let n=1;n<=doc.numPages;n++){const d=document.createElement('div');d.className='ph';d.textContent='পাতা '+n;d.dataset.n=n;box.appendChild(d);slots.push(d)}
    const render = async el=>{
      if(el.dataset.done) return; el.dataset.done=1;
      const page = await doc.getPage(+el.dataset.n);
      const w = box.clientWidth || 600; const vp1 = page.getViewport({scale:1});
      const scale = (w/vp1.width)*(window.devicePixelRatio||1); const vp = page.getViewport({scale});
      const c = document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.setAttribute('aria-label','পাতা '+el.dataset.n);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      el.replaceWith(c); progress();
    };
    const io = new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){io.unobserve(x.target);render(x.target)}}),{rootMargin:'800px'});
    slots.forEach(s=>io.observe(s));
  }catch(err){ box.innerHTML = `<p class="loading" style="margin:1rem 0">PDF দেখানো গেল না। ওপরের লিংক থেকে ফাইলটি খুলুন।</p>`; }
}

async function route(){
  const h = decodeURIComponent((location.hash||'').slice(1)) || 'home';
  try{
    const W = await works();
    const cat = cats(W).find(c=>c.token===h);
    if(cat){ await category(cat); window.scrollTo(0,0); progress(); return; }
    const m = h.match(/^(.+)-(\d+)$/);
    const w = W.find(x=>x.id===h) || (m && W.find(x=>x.id===m[1]));
    if(!w || h==='home'){ await home(); }
    else {
      const d = await work(w.id);
      if(d.format==='book'){
        if(m && w.id===m[1] && d.chapters[+m[2]-1]) chapter(w.id,d,+m[2]-1); else cover(w.id,d);
      } else if(d.format==='pdf') await pdfView(w.id,d);
      else piece(w.id,d);
    }
  }catch(err){ app.innerHTML = '<p class="loading">লেখাটি লোড করা গেল না। একটু পরে আবার চেষ্টা করুন।</p>'; }
  window.scrollTo(0,0); progress();
}
window.addEventListener('hashchange', route);

/* reading tools */
const sizes = [1,1.06,1.12,1.2,1.3,1.42];
let fi = Math.min(sizes.length-1, Math.max(0, parseInt(store.get('fs')??'2',10)||2));
function applyFs(){document.documentElement.style.setProperty('--fs', sizes[fi]+'rem'); store.set('fs', fi)}
document.getElementById('fs-up').onclick=()=>{fi=Math.min(sizes.length-1,fi+1);applyFs()};
document.getElementById('fs-down').onclick=()=>{fi=Math.max(0,fi-1);applyFs()};
applyFs();
if(store.get('gh-token')) document.getElementById('authorlink').hidden=false;
const t0 = store.get('theme'); if(t0==='dark'||t0==='light') document.documentElement.setAttribute('data-theme',t0);
document.getElementById('theme').onclick=()=>{
  const isDark = document.documentElement.getAttribute('data-theme')==='dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const nt = isDark?'light':'dark'; document.documentElement.setAttribute('data-theme',nt); store.set('theme',nt);
};
const bar = document.getElementById('progress');
function progress(){const m=document.documentElement.scrollHeight-innerHeight;bar.style.width=(m>40?Math.min(100,scrollY/m*100):0)+'%'}
addEventListener('scroll',progress,{passive:true}); addEventListener('resize',progress);
route();
})();
</script>

</body>
</html>
